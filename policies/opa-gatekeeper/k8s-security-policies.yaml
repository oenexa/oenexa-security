apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8scontainernoprivilege
  annotations:
    description: "Prohibits containers from running in privileged mode across all namespaces."
spec:
  crd:
    spec:
      names:
        kind: K8sContainerNoPrivilege
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8scontainernoprivilege

        violation[{"msg": msg, "details": {}}] {
            c := input_containers[_]
            c.securityContext.privileged
            msg := sprintf("Privileged container '%v' is strictly prohibited by OENEXA Security Standards.", [c.name])
        }

        input_containers[c] {
            c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
            c := input.review.object.spec.initContainers[_]
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerNoPrivilege
metadata:
  name: no-privileged-containers
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "DaemonSet", "StatefulSet"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirelimits
  annotations:
    description: "Requires CPU and Memory resource limits on every container."
spec:
  crd:
    spec:
      names:
        kind: K8sRequireLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirelimits

        violation[{"msg": msg}] {
            c := input.review.object.spec.template.spec.containers[_]
            not c.resources.limits.cpu
            msg := sprintf("Container '%v' has no CPU limit defined.", [c.name])
        }

        violation[{"msg": msg}] {
            c := input.review.object.spec.template.spec.containers[_]
            not c.resources.limits.memory
            msg := sprintf("Container '%v' has no Memory limit defined.", [c.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireLimits
metadata:
  name: mandatory-resource-limits
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:
      - oenexa-production
      - oenexa-staging
