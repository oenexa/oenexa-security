groups:
  - name: oenexa-security-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oenexa-security\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oenexa-security instance is down\"
          description: \"Pod for oenexa-security has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oenexa-security\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oenexa-security\"